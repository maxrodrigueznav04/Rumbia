<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF6EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141A17" media="(prefers-color-scheme: dark)" />

    <!-- Ver client/public/theme-init.js: por que vive en un archivo aparte. -->
    <script src="/theme-init.js"></script>

    <title>Rumbia — Planeador de viajes con IA para viajeros y agencias</title>
    <meta
      name="description"
      content="Planea viajes completos en minutos: itinerarios día por día con IA, cotizaciones oficiales en PDF con tu logo y margen, rutas, vuelos y hospedajes."
    />
    <link rel="canonical" href="https://rumbiamx.com/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Open Graph. Las URL tienen que ser absolutas: quien lee estas etiquetas es
      el servidor de WhatsApp, Facebook o LinkedIn, no el navegador.
      La imagen og.jpg pesa ~68 KB (muy por debajo del límite de 300 KB de WhatsApp)
      y tiene la relación de aspecto estándar 1200x630 (1.91:1).
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rumbia" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="https://rumbiamx.com/" />
    <meta property="og:title" content="Rumbia — Planeador de viajes con IA para viajeros y agencias" />
    <meta
      property="og:description"
      content="Planea viajes completos en minutos: itinerarios día por día con IA, cotizaciones oficiales en PDF con tu logo y margen, rutas, vuelos y hospedajes."
    />
    <meta property="og:image" content="https://rumbiamx.com/og.jpg" />
    <meta property="og:image:secure_url" content="https://rumbiamx.com/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      property="og:image:alt"
      content="Rumbia: planea viajes completos con IA para viajeros y agencias de viaje."
    />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@rumbiamx" />
    <meta name="twitter:title" content="Rumbia — Planeador de viajes con IA para viajeros y agencias" />
    <meta
      name="twitter:description"
      content="Planea viajes completos en minutos: itinerarios día por día con IA, cotizaciones oficiales en PDF con tu logo y margen, rutas, vuelos y hospedajes."
    />
    <meta name="twitter:image" content="https://rumbiamx.com/og.jpg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
