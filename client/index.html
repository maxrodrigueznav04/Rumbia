<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBF6EC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141A17" media="(prefers-color-scheme: dark)" />

    <!--
      Aplica el tema guardado ANTES de que cargue el resto de la pagina: sin
      esto, quien eligio "oscuro" a mano (distinto de lo que ya trae su
      sistema) ve un parpadeo claro->oscuro apenas perceptible en cada carga.
      El caso "seguir al sistema" no lo necesita — eso ya lo resuelve
      prefers-color-scheme en el CSS, sin JS de por medio.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('rumbo-tema');
          if (t === 'claro' || t === 'oscuro') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (e) {
          /* localStorage bloqueado (navegacion privada estricta): sigue al sistema, sin romper nada. */
        }
      })();
    </script>

    <title>Rumbo — Planeador de viajes con IA</title>
    <meta
      name="description"
      content="Planea tu viaje completo en un solo lugar: transporte, hospedaje, presupuesto e itinerario día por día generado con IA."
    />
    <link rel="canonical" href="https://rumbo.maxrodrigueznav04.workers.dev/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!--
      Open Graph. Las URL tienen que ser absolutas: quien lee estas etiquetas es
      el servidor de WhatsApp, Facebook o LinkedIn, no el navegador, y una ruta
      relativa no le sirve para nada.

      Es una SPA, asi que todas las rutas devuelven este mismo HTML y comparten
      la vista previa. Es lo correcto aqui: las pantallas internas piden sesion,
      y de todos modos lo que se comparte es la portada.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rumbo" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="https://rumbo.maxrodrigueznav04.workers.dev/" />
    <meta property="og:title" content="Rumbo — Planeador de viajes con IA" />
    <meta
      property="og:description"
      content="Planea tu viaje completo en un solo lugar: transporte, hospedaje, presupuesto e itinerario día por día generado con IA."
    />
    <meta property="og:image" content="https://rumbo.maxrodrigueznav04.workers.dev/og.png" />
    <!-- Declarar el tamano evita que la vista previa salga en blanco la primera
         vez, antes de que el rastreador alcance a descargar la imagen. -->
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta property="og:image:type" content="image/png" />
    <meta
      property="og:image:alt"
      content="Rumbo: planea tu viaje completo en un solo lugar. Itinerario con IA, mapa y clima, control de presupuesto."
    />

    <!-- X/Twitter no lee og:image sin su propia etiqueta de tarjeta. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rumbo — Planeador de viajes con IA" />
    <meta
      name="twitter:description"
      content="Planea tu viaje completo en un solo lugar: transporte, hospedaje, presupuesto e itinerario día por día generado con IA."
    />
    <meta name="twitter:image" content="https://rumbo.maxrodrigueznav04.workers.dev/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
