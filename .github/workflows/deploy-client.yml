name: Deploy cliente a Cloudflare

# Se dispara cuando el workflow "CI" TERMINA en main, no por push directo:
# antes, esto corria en paralelo a CI, sin relacion entre los dos, asi que
# un push con las pruebas del cliente rotas se desplegaba igual (CI se ponia
# rojo, pero por separado, sin frenar nada). Ahora depende de su resultado.
#
# El precio de este cambio: se pierde el filtro `paths: ['client/**']` --
# workflow_run no lo soporta, asi que esto corre en CADA CI exitoso en main,
# no solo cuando cambia el cliente (el build igual es rapido y "deploy" ya
# encadena "build", asi que republicar un dist/ identico no hace dano, solo
# gasta unos segundos de mas).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-client-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build y wrangler deploy
    runs-on: ubuntu-latest
    # workflow_run se dispara con CUALQUIER conclusion (tambien si CI fallo):
    # sin este filtro, un CI en rojo igual disparaba el deploy de todas formas.
    if: github.event.workflow_run.conclusion == 'success'
    steps:
      # Se despliega exactamente el commit que CI aprobo (head_sha del run),
      # no el HEAD actual de main -- que para cuando este job arranca ya
      # pudo avanzar con un commit nuevo que CI ni siquiera reviso todavia.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        working-directory: client
        run: npm ci

      # Repite las pruebas aqui mismo, como segunda red ademas de CI: confiar
      # solo en la conclusion de otro workflow (workflow_run) sin verificar
      # nada localmente dejaria pasar, por ejemplo, un cambio a este propio
      # archivo que rompiera el deploy sin que ninguna prueba lo hubiera visto.
      - name: Pruebas
        working-directory: client
        run: npm test

      # "deploy" ya encadena "build": nunca publica un dist/ viejo. Vite
      # incrusta VITE_* en el bundle AL COMPILAR (no se leen despues en
      # ningun dashboard de Cloudflare) -- sin pasarlas aqui, el sitio se
      # publica apuntando a un backend vacio ("" cae al dominio del propio
      # sitio, no a la API real).
      #
      # Secrets obligatorios en Settings > Secrets and variables > Actions:
      #   CLOUDFLARE_API_TOKEN  - permiso "Edit Cloudflare Workers"
      #   VITE_API_URL          - ej. https://api.rumbiamx.com/api
      # Opcionales (sin ellas el widget de Turnstile simplemente no aparece y
      # el monitoreo de errores queda apagado, igual que en local sin
      # configurar nada):
      #   VITE_TURNSTILE_SITE_KEY
      #   VITE_SENTRY_DSN
      #
      # Si CLOUDFLARE_API_TOKEN no alcanza a resolver la cuenta solo (mensaje
      # "Multiple accounts found"), agrega tambien CLOUDFLARE_ACCOUNT_ID como
      # secret y descomenta esa linea.
      - name: Deploy a Cloudflare
        working-directory: client
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
