name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo cancela la corrida anterior de la misma rama: no tiene sentido
# gastar minutos verificando un commit que ya quedo atras.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API — pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        working-directory: server
        run: npm ci

      # Las pruebas del servidor no tocan la base ni las APIs externas: validan
      # modelos, validadores y servicios en memoria, asi que corren sin secretos.
      - name: Pruebas
        working-directory: server
        run: npm test

  frontend:
    name: Cliente — pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        working-directory: client
        run: npm ci

      - name: Pruebas
        working-directory: client
        run: npm test

      # El build es parte de la verificacion: un import roto o una variable de
      # entorno mal usada no aparecen hasta que Vite arma el bundle.
      - name: Build
        working-directory: client
        run: npm run build
