name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo cancela la corrida anterior de la misma rama: no tiene sentido
# gastar minutos verificando un commit que ya quedo atras.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API — pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependencias
        working-directory: server
        run: npm ci

      - name: Preparar Chromium para emitir PDF reales
        working-directory: server
        run: npm run browser:install -- --with-deps

      # MongoDB temporal aislado y Chromium; no usa bases ni claves de producción.
      - name: Pruebas
        working-directory: server
        run: npm test

      - name: Verificar trece diseños con viajes de 3 y 15 días
        working-directory: server
        run: node scripts/visual-pdf-prototype.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: propuestas-pdf-prueba
          path: output/pdf/*.pdf
          retention-days: 7

  frontend:
    name: Cliente — pruebas y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Instalar dependencias
        working-directory: client
        run: npm ci

      - name: Pruebas
        working-directory: client
        run: npm test

      # El build es parte de la verificacion: un import roto o una variable de
      # entorno mal usada no aparecen hasta que Vite arma el bundle.
      - name: Build
        working-directory: client
        run: npm run build
