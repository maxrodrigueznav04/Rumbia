# Blueprint de Render para la API. En el panel: New > Blueprint y apunta a este repo.
# Las claves marcadas sync:false se capturan a mano en el dashboard, no van en git.
services:
  - type: web
    name: rumbo-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: AI_RATE_LIMIT_PER_HOUR
        value: 10
