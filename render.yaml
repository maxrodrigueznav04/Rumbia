# Blueprint de Render para la API. En el panel: New > Blueprint y apunta a este repo.
# Las claves marcadas sync:false se capturan a mano en el dashboard, no van en git.
services:
  - type: web
    name: rumbo-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Explicito a proposito: Google retira modelos para keys nuevas y el 404
      # que devuelve no es obvio. Tenerlo aqui hace trivial cambiarlo sin tocar codigo.
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: OPENWEATHER_API_KEY
        sync: false
      # Correo de recuperacion de contrasena. Sin la clave la app sigue en pie,
      # pero quien olvide su contrasena no puede recuperarla.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      # Logos de agencia. Sin estas tres, la subida de logo responde con un
      # aviso claro y el campo de URL manual sigue funcionando igual.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: AI_RATE_LIMIT_PER_HOUR
        value: 10
      # Enlaces de afiliado. Se deja sin valor a proposito: mientras no exista,
      # los enlaces salen como busquedas publicas y la app no dice que gana
      # comision. Al aprobar una red se pega aqui el JSON y basta con eso.
      - key: AFFILIATE_LINKS
        sync: false
